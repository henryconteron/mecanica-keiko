name: Actualizar catálogo y servicios

on:
  push:
    paths:
      - ".github/workflows/actualizar-catalogo.yml"
      - "catalogo/**"
      - "servicios/**"
      - "assets/marca/**"
      - "scripts/generar-catalogo.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del sitio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Generar páginas estáticas y galerías de servicios
        run: node scripts/generar-catalogo.mjs

      - name: Guardar contenido actualizado
        run: |
          if git diff --quiet data/catalogo.json data/servicios.json productos/; then
            echo "No hay cambios generados"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogo.json data/servicios.json productos/
          git commit -m "Actualizar catálogo y servicios [skip ci]"
          git push
