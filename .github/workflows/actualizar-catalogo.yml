name: Actualizar catálogo y servicios

on:
  push:
    paths:
      - ".github/workflows/actualizar-catalogo.yml"
      - "catalogo/**"
      - "servicios/**"
      - "assets/marca/**"
      - "scripts/generar-catalogo.mjs"
      - "scripts/sincronizar-publicacion.mjs"
      - "assets/config.js"
      - "assets/ficha-publica.*"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: sincronizar-publicacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del sitio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Generar páginas estáticas y galerías de servicios
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/generar-catalogo.mjs --servicios
          node scripts/sincronizar-publicacion.mjs

      - name: Guardar contenido actualizado
        run: |
          git add data/catalogo-panel.json data/servicios.json productos/ index.html sitemap.xml assets/social/
          if git diff --cached --quiet; then
            echo "No hay cambios generados"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar catálogo y servicios [skip ci]"
          git pull --rebase origin main
          git push
          curl --fail-with-body --retry 2 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
