name: Actualizar catálogo

on:
  push:
    paths:
      - "catalogo/**"
      - "scripts/generar-catalogo.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del sitio
        uses: actions/checkout@v4

      - name: Generar catálogo desde las carpetas
        run: node scripts/generar-catalogo.mjs

      - name: Guardar catálogo actualizado
        run: |
          if git diff --quiet data/catalogo.json productos/; then
            echo "No hay cambios en el catálogo"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogo.json productos/
          git commit -m "Actualizar catálogo [skip ci]"
          git push
