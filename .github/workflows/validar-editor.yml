name: Validar proyecto
on:
  push:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'supabase/**'
      - '*.html'
      - 'service-worker.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - 'supabase/**'
      - '*.html'
      - 'service-worker.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Comprobar JavaScript
        run: |
          for file in assets/*.js scripts/*.mjs tests/*.mjs service-worker.js; do
            node --check "$file"
          done
      - name: Pruebas aisladas, sin secretos ni escrituras a producción
        run: pnpm test
      - name: Dependencias sin vulnerabilidades altas conocidas
        run: pnpm audit --audit-level=high
